name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The sandbox tests need bubblewrap and socat, and bwrap needs unprivileged user namespaces, which Ubuntu 24.04
      # restricts through AppArmor by default.
      - name: Sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm ci
      - run: npm run typecheck
      # SF_REQUIRE_SANDBOX=1: a broken sandbox fails the run instead of skipping the sandbox tests.
      - run: npm test
        env:
          SF_REQUIRE_SANDBOX: "1"
